name: Android CI/CD

on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*' # Triggers the workflow when a tag starting with 'v' is pushed
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: write # Crucial parameter: grants permission to create releases and upload assets

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Artifact (Internal GA Storage)
      uses: actions/upload-artifact@v4
      with:
        name: android-release-apk
        path: app/build/outputs/apk/release/

    - name: Create GitHub Release and Upload Asset
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/') # Executes this step only if triggered by a Git tag
      with:
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
